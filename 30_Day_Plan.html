<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>30-Day Robotics Plan — Beginner to Builder</title>
  <meta name="description"
    content="A comprehensive 30-day hands-on guide to building your first autonomous robot, from basic electronics to obstacle avoidance.">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --bg: #0a0e17;
      --bg2: #111827;
      --bg3: #1a2236;
      --bg4: #243049;
      --text: #e2e8f0;
      --text2: #94a3b8;
      --text3: #64748b;
      --accent: #3b82f6;
      --accent2: #8b5cf6;
      --accent3: #06b6d4;
      --green: #10b981;
      --yellow: #f59e0b;
      --red: #ef4444;
      --orange: #f97316;
      --glass: rgba(255, 255, 255, 0.05);
      --glass2: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.08);
      --radius: 12px;
      --radius2: 16px;
      --shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
    }

    html {
      scroll-behavior: smooth
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      overflow-x: hidden
    }

    h1,
    h2,
    h3,
    h4 {
      font-weight: 700;
      line-height: 1.3
    }

    /* SCROLLBAR */
    ::-webkit-scrollbar {
      width: 6px
    }

    ::-webkit-scrollbar-track {
      background: var(--bg)
    }

    ::-webkit-scrollbar-thumb {
      background: var(--bg4);
      border-radius: 3px
    }

    /* SIDEBAR */
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 280px;
      height: 100vh;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      z-index: 100;
      transition: transform .3s
    }

    .sidebar-header {
      padding: 24px 20px;
      border-bottom: 1px solid var(--border);
      text-align: center
    }

    .sidebar-header h2 {
      font-size: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent
    }

    .sidebar-header .progress-bar {
      margin-top: 12px;
      height: 6px;
      background: var(--bg4);
      border-radius: 3px;
      overflow: hidden
    }

    .sidebar-header .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--green));
      border-radius: 3px;
      transition: width .5s ease
    }

    .sidebar-header .progress-text {
      font-size: 12px;
      color: var(--text3);
      margin-top: 6px
    }

    .week-group {
      padding: 8px 0
    }

    .week-label {
      padding: 8px 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--accent);
      opacity: .8
    }

    .day-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 20px;
      font-size: 13px;
      color: var(--text2);
      cursor: pointer;
      transition: all .2s;
      text-decoration: none;
      border-left: 3px solid transparent
    }

    .day-link:hover {
      background: var(--glass);
      color: var(--text)
    }

    .day-link.active {
      background: var(--glass2);
      color: var(--accent);
      border-left-color: var(--accent)
    }

    .day-link.completed .day-dot {
      background: var(--green)
    }

    .day-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--bg4);
      flex-shrink: 0;
      transition: background .3s
    }

    /* MAIN */
    .main {
      margin-left: 280px;
      min-height: 100vh
    }

    /* HERO */
    .hero {
      position: relative;
      padding: 80px 60px 60px;
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.15), rgba(139, 92, 246, 0.15));
      overflow: hidden
    }

    .hero::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.12), transparent 60%);
      pointer-events: none
    }

    .hero::after {
      content: '';
      position: absolute;
      bottom: -30%;
      left: -10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.1), transparent 60%);
      pointer-events: none
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: var(--glass2);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 20px
    }

    .hero h1 {
      font-size: 42px;
      font-weight: 900;
      line-height: 1.15;
      max-width: 700px
    }

    .hero h1 span {
      background: linear-gradient(135deg, var(--accent), var(--accent2), var(--accent3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent
    }

    .hero p {
      margin-top: 16px;
      font-size: 17px;
      color: var(--text2);
      max-width: 600px
    }

    .hero-stats {
      display: flex;
      gap: 32px;
      margin-top: 32px;
      flex-wrap: wrap
    }

    .hero-stat {
      text-align: center
    }

    .hero-stat .num {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent
    }

    .hero-stat .lbl {
      font-size: 12px;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 2px
    }

    /* CONTENT AREA */
    .content {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 60px 80px
    }

    /* DAY CARD */
    .day-card {
      margin-bottom: 48px;
      animation: fadeUp .5s ease
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .day-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border)
    }

    .day-number {
      width: 56px;
      height: 56px;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      flex-shrink: 0
    }

    .week1-color {
      background: linear-gradient(135deg, #3b82f6, #2563eb)
    }

    .week2-color {
      background: linear-gradient(135deg, #8b5cf6, #7c3aed)
    }

    .week3-color {
      background: linear-gradient(135deg, #06b6d4, #0891b2)
    }

    .week4-color {
      background: linear-gradient(135deg, #f59e0b, #d97706)
    }

    .day-title {
      font-size: 22px;
      font-weight: 700
    }

    .day-subtitle {
      font-size: 13px;
      color: var(--text3);
      margin-top: 2px
    }

    /* SECTIONS */
    .section {
      margin-bottom: 24px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius2);
      overflow: hidden
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 20px;
      cursor: pointer;
      user-select: none;
      transition: background .2s
    }

    .section-header:hover {
      background: var(--glass)
    }

    .section-header .icon {
      font-size: 18px
    }

    .section-header h3 {
      font-size: 15px;
      font-weight: 600;
      flex: 1
    }

    .section-header .chevron {
      transition: transform .3s;
      color: var(--text3);
      font-size: 12px
    }

    .section-header.open .chevron {
      transform: rotate(180deg)
    }

    .section-body {
      padding: 0 20px 20px;
      display: none
    }

    .section-body.open {
      display: block
    }

    .section-body p,
    .section-body li {
      font-size: 14px;
      color: var(--text2);
      line-height: 1.8
    }

    .section-body ul,
    .section-body ol {
      padding-left: 20px;
      margin: 8px 0
    }

    .section-body li {
      margin: 4px 0
    }

    .section-body h4 {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
      margin: 16px 0 8px;
      text-transform: uppercase;
      letter-spacing: .5px
    }

    .section-body strong {
      color: var(--text);
      font-weight: 600
    }

    /* CODE BLOCKS */
    pre {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      overflow-x: auto;
      margin: 12px 0;
      font-size: 13px;
      line-height: 1.6
    }

    code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px
    }

    .inline-code {
      background: var(--bg);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 13px;
      border: 1px solid var(--border)
    }

    /* FORMULA BOX */
    .formula {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(139, 92, 246, 0.1));
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 8px;
      padding: 16px 20px;
      margin: 12px 0;
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--accent)
    }

    /* CIRCUIT DIAGRAM SVG */
    .circuit-diagram {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin: 16px 0;
      text-align: center
    }

    .circuit-diagram svg {
      max-width: 100%;
      height: auto
    }

    /* TIPS / WARNINGS */
    .callout {
      border-radius: 8px;
      padding: 14px 16px;
      margin: 12px 0;
      font-size: 13px;
      display: flex;
      gap: 10px;
      align-items: flex-start
    }

    .callout.warning {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.2);
      color: #fbbf24
    }

    .callout.danger {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #f87171
    }

    .callout.tip {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: #34d399
    }

    .callout.info {
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.2);
      color: #60a5fa
    }

    /* CHECKPOINT */
    .checkpoint {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius2);
      padding: 20px;
      margin-top: 20px
    }

    .checkpoint h4 {
      font-size: 14px;
      font-weight: 700;
      color: var(--green);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .check-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      font-size: 14px;
      color: var(--text2);
      cursor: pointer;
      transition: color .2s
    }

    .check-item:hover {
      color: var(--text)
    }

    .check-item input[type=checkbox] {
      width: 18px;
      height: 18px;
      accent-color: var(--green);
      cursor: pointer
    }

    .check-item.checked {
      color: var(--green);
      text-decoration: line-through;
      opacity: .7
    }

    /* WEEK DIVIDER */
    .week-divider {
      text-align: center;
      padding: 48px 0 32px;
      position: relative
    }

    .week-divider::before {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 1px;
      background: var(--border)
    }

    .week-divider span {
      position: relative;
      background: var(--bg);
      padding: 0 24px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent)
    }

    /* MATERIALS TABLE */
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 13px
    }

    th {
      text-align: left;
      padding: 10px 12px;
      background: var(--bg);
      color: var(--accent);
      font-weight: 600;
      border-bottom: 2px solid var(--border)
    }

    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text2)
    }

    tr:hover td {
      background: var(--glass)
    }

    /* HAMBURGER */
    .hamburger {
      display: none;
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 200;
      width: 40px;
      height: 40px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: var(--text)
    }

    /* RESPONSIVE */
    @media(max-width:900px) {
      .sidebar {
        transform: translateX(-100%)
      }

      .sidebar.open {
        transform: translateX(0)
      }

      .main {
        margin-left: 0
      }

      .hamburger {
        display: flex
      }

      .hero {
        padding: 60px 24px 40px
      }

      .hero h1 {
        font-size: 28px
      }

      .content {
        padding: 24px
      }
    }
  </style>
</head>

<body>

  <button class="hamburger" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button>

  <nav class="sidebar" id="sidebar"></nav>

  <main class="main">
    <section class="hero">
      <div class="hero-badge">🚀 30-Day Plan</div>
      <h1>From Zero to <span>Robot Builder</span></h1>
      <p>A complete hands-on guide taking you from absolute beginner to building a fully autonomous obstacle-avoiding
        robot. No prior experience required.</p>
      <div class="hero-stats">
        <div class="hero-stat">
          <div class="num">30</div>
          <div class="lbl">Days</div>
        </div>
        <div class="hero-stat">
          <div class="num">4</div>
          <div class="lbl">Weeks</div>
        </div>
        <div class="hero-stat">
          <div class="num">1-2h</div>
          <div class="lbl">Per Day</div>
        </div>
        <div class="hero-stat">
          <div class="num" id="progressPct">0%</div>
          <div class="lbl">Complete</div>
        </div>
      </div>
    </section>
    <div class="content" id="content"></div>
  </main>

  <script>
    // ========== DAY CONTENT DATA ==========
    const DAYS = [
      {
        title: "What is Electricity?", short: "Electricity", subtitle: "Voltage, Current, Resistance & Ohm's Law",
        objectives: ["Understand voltage, current, and resistance", "Learn Ohm's Law and apply it to a real circuit", "Light your first LED with proper current limiting"],
        diagram: `<svg width="100%" height="240" viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg" style="background:var(--bg3); border-radius:8px;">
  <rect width="400" height="240" fill="none" />
  <path d="M 60 120 L 60 60 L 200 60" fill="none" stroke="var(--red)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 60 180 L 60 210 L 340 210 L 340 180" fill="none" stroke="var(--text3)" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="35" y="120" width="50" height="60" fill="var(--bg4)" stroke="var(--accent)" stroke-width="2" rx="4"/>
  <text x="60" y="155" fill="var(--accent)" font-family="Inter" font-size="12" text-anchor="middle" font-weight="bold">9V</text>
  <rect x="200" y="50" width="60" height="20" fill="var(--bg4)" stroke="var(--text2)" stroke-width="1" rx="4"/>
  <path d="M 215 50 L 215 70" stroke="var(--red)" stroke-width="4"/>
  <path d="M 225 50 L 225 70" stroke="var(--red)" stroke-width="4"/>
  <path d="M 235 50 L 235 70" stroke="#b45309" stroke-width="4"/>
  <text x="230" y="85" fill="var(--text3)" font-family="Inter" font-size="10" text-anchor="middle">220Ω</text>
  <path d="M 260 60 L 340 60 L 340 100" fill="none" stroke="var(--red)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 320 120 A 20 20 0 1 1 360 120 L 360 150 L 320 150 Z" fill="rgba(16, 185, 129, 0.1)" stroke="var(--green)" stroke-width="2"/>
  <line x1="320" y1="150" x2="360" y2="150" stroke="var(--green)" stroke-width="2"/>
  <line x1="340" y1="150" x2="340" y2="180" stroke="var(--text3)" stroke-width="2.5"/>
  <text x="340" y="140" fill="var(--green)" font-family="Inter" font-size="12" text-anchor="middle" font-weight="bold">LED</text>
</svg>`,
        theory: `<h4>Three Fundamental Concepts</h4>
<p><strong>Voltage (V)</strong> — Measured in Volts. The "electrical pressure" that pushes electrons through a circuit. Like water pressure in a pipe.</p>
<p><strong>Current (I)</strong> — Measured in Amperes (Amps). The actual flow of electrons. Like the volume of water flowing through a pipe.</p>
<p><strong>Resistance (R)</strong> — Measured in Ohms (Ω). Opposes the flow of current. Like the narrowness of the pipe.</p>
<div class="formula">V = I × R &nbsp;&nbsp;(Ohm's Law)</div>
<p>Rearranged: <strong>I = V / R</strong> &nbsp;|&nbsp; <strong>R = V / I</strong></p>
<p><strong>Example:</strong> 5V supply, want 20mA through LED (2V drop). R = 3V / 0.020A = 150Ω. Use 220Ω for safety.</p>
<div class="callout info">💡 Every motor, sensor, and microcontroller operates within specific voltage and current ranges. Exceed them, and you destroy components.</div>`,
        practical: `<h4>Light an LED with a Resistor</h4>
<p><strong>Materials:</strong> Breadboard, LED, 220Ω resistor, jumper wires, 9V battery</p>
<h4>Understanding the Breadboard</h4>
<ul><li>Outer columns (+/−) are <strong>power rails</strong> — connected vertically</li>
<li>Inner rows connected <strong>horizontally</strong> in groups of 5</li><li>Gap in the middle separates left and right</li></ul>
<h4>Step-by-Step</h4>
<ol><li>Insert LED — <strong>longer leg = positive (anode)</strong>, shorter = negative (cathode)</li>
<li>Connect 220Ω resistor to the same row as the LED's anode</li>
<li>Wire the resistor's other end to the + power rail</li>
<li>Wire the LED cathode to the − power rail</li>
<li>Connect battery: + to + rail, − to − rail</li>
<li>LED lights up! 🎉</li></ol>
<div class="callout tip">💡 Try reversing the LED — it won't light because LEDs only allow current in one direction.</div>`,
        troubleshooting: ["<strong>LED doesn't light:</strong> Check polarity (long leg = positive). Ensure components are in the SAME row.", "<strong>LED is dim:</strong> Battery might be dead.", "<strong>LED burned out:</strong> You probably forgot the resistor."],
        checkpoints: ["Can you explain voltage, current, and resistance?", "Can you use Ohm's Law to calculate a resistor value?", "Did your LED circuit work?", "Do you understand why the resistor is needed?"]
      },

      {
        title: "Using Tools — The Multimeter", short: "Multimeter", subtitle: "Measuring Voltage, Resistance & Continuity",
        objectives: ["Understand what a multimeter measures", "Measure voltage and resistance", "Learn continuity testing for debugging"],
        theory: `<h4>The Multimeter — Your Most Important Tool</h4>
<p>A multimeter measures three things:</p>
<table><tr><th>Mode</th><th>Measures</th><th>Use For</th></tr>
<tr><td>V⎓ (DC Voltage)</td><td>Voltage between two points</td><td>Checking batteries, voltage drops</td></tr>
<tr><td>Ω (Resistance)</td><td>Resistance of a component</td><td>Verifying resistor values</td></tr>
<tr><td>🔊 (Continuity)</td><td>Whether two points are connected</td><td>Finding broken wires, tracing circuits</td></tr></table>
<h4>Reading Resistor Color Bands</h4>
<table><tr><th>Color</th><th>Value</th><th>Color</th><th>Value</th></tr>
<tr><td>Black</td><td>0</td><td>Green</td><td>5</td></tr>
<tr><td>Brown</td><td>1</td><td>Blue</td><td>6</td></tr>
<tr><td>Red</td><td>2</td><td>Violet</td><td>7</td></tr>
<tr><td>Orange</td><td>3</td><td>Gray</td><td>8</td></tr>
<tr><td>Yellow</td><td>4</td><td>White</td><td>9</td></tr></table>
<p><strong>Example:</strong> Red-Red-Brown-Gold = 2, 2, ×10 = <strong>220Ω ±5%</strong></p>
<div class="callout info">💡 When your robot doesn't work, the multimeter finds the problem. Is the battery dead? Is a wire broken? The multimeter answers these.</div>`,
        practical: `<h4>Exercise 1: Measure Battery Voltage</h4>
<ol><li>Set multimeter to DC Voltage (20V range)</li><li>RED probe to battery +, BLACK to −</li><li>Fresh 9V should read 8.5–9.5V</li></ol>
<h4>Exercise 2: Measure Resistors</h4>
<ol><li>Set to Ω mode, 20kΩ range</li><li>Touch probes to both ends of a 220Ω resistor</li><li>Should read 209–231Ω (within ±5%)</li></ol>
<h4>Exercise 3: Kirchhoff's Voltage Law</h4>
<ol><li>Rebuild your Day 1 LED circuit</li><li>Measure voltage across the battery (~9V)</li><li>Measure across the resistor (~7V) and LED (~2V)</li><li>Notice: <strong>7V + 2V ≈ 9V</strong> — voltages in a loop add up!</li></ol>`,
        troubleshooting: ["<strong>Shows 'OL':</strong> Wrong range — switch higher.", "<strong>Resistance fluctuates:</strong> Your fingers are touching both probes.", "<strong>Battery reads 0V:</strong> Check you're in DC voltage mode."],
        checkpoints: ["Can you measure voltage from a battery?", "Can you verify a resistor's value?", "Can you use continuity mode?", "Do you understand Kirchhoff's Voltage Law?"]
      },

      {
        title: "Series & Parallel Circuits", short: "Series/Parallel", subtitle: "Two Ways to Connect Components",

<p><strong>Example:</strong> 220Ω resistor, 20mA → P = (0.020)² × 220 = 88mW. Standard 250mW resistor is safe.</p>
<p><strong>Danger:</strong> 10Ω resistor, 500mA → P = 2.5W → Standard resistor would <strong>BURN UP!</strong></p>
<h4>Voltage Dividers</h4>
<p>Two resistors creating a fraction of input voltage:</p>

        theory: `<h4>Capacitor Basics</h4>
<p>A capacitor stores electrical energy — like a tiny rechargeable battery that charges/discharges very quickly.</p>
<table><tr><th>Type</th><th>Values</th><th>Polarized?</th><th>Use</th></tr>
<tr><td>Electrolytic</td><td>1μF–10000μF</td><td>YES ⚠️</td><td>Power smoothing</td></tr>
<tr><td>Ceramic</td><td>0.001μF–1μF</td><td>No</td><td>High-freq filtering</td></tr></table>
<div class="callout danger">🚫 Electrolytic capacitors MUST have correct polarity. Reversing can cause <strong>EXPLOSION</strong>.</div>
<h4>RC Time Constant</h4>
<div class="formula">τ = R × C</div>
<ul><li>After 1τ: 63% charged</li><li>After 3τ: 95% charged</li><li>After 5τ: 99% charged</li></ul>
<p><strong>Example:</strong> R=10kΩ, C=100μF → τ = 1 second → Full charge ≈ 5 seconds</p>
<h4>Decoupling — The Unsung Hero</h4>
<p>Without decoupling capacitors, your robot's Arduino will randomly reset when motors start. Sensors give garbage readings.</p>
<div class="callout tip">💡 <strong>Rule of thumb:</strong> 100μF electrolytic near power input + 0.1μF ceramic near each IC.</div>`,

        theory: `<h4>Pulse Width Modulation</h4>
<p>Instead of reducing voltage (which reduces torque), PWM rapidly switches ON/OFF. The motor's inertia smooths this out.</p>
<table><tr><th>Duty Cycle</th><th>Avg Voltage (6V)</th><th>Speed</th></tr>
<tr><td>100%</td><td>6.0V</td><td>Full</td></tr><tr><td>75%</td><td>4.5V</td><td>Fast</td></tr>
<tr><td>50%</td><td>3.0V</td><td>Medium</td></tr><tr><td>25%</td><td>1.5V</td><td>Slow</td></tr>
<tr><td>0%</td><td>0V</td><td>Stopped</td></tr></table>
<div class="formula">V_average = V_supply × (duty_cycle / 100)</div>
<p><strong>Arduino PWM:</strong> <code class="inline-code">analogWrite(pin, value)</code> where value is 0–255</p>
<ul><li>analogWrite(pin, 0) = 0% duty cycle</li><li>analogWrite(pin, 127) = ~50%</li><li>analogWrite(pin, 255) = 100%</li></ul>`,

<tr><td>Li-Po 7.4V</td><td>7.4V</td><td>2200mAh</td><td>⭐⭐⭐</td></tr>
<tr><td>4×AA NiMH</td><td>4.8V</td><td>2000mAh</td><td>⭐⭐</td></tr>
<tr><td>6×AA Alkaline</td><td>9V</td><td>2000mAh</td><td>⭐⭐</td></tr>
<tr><td>9V Battery</td><td>9V</td><td>500mAh</td><td>⭐</td></tr></table>
<div class="formula">Runtime (hrs) = Capacity (mAh) / Current Draw (mA)</div>
<h4>Battery Monitoring</h4>
<pre><code>float getBatteryV() {
  int raw = analogRead(A1);
  return raw * (5.0/1023.0) * 2.0;
}
if (getBatteryV() < 4.5)
  Serial.println("LOW BATTERY!");</code></pre>`,
        practical: `<h4>Optimize Your Robot</h4>
<ol><li>Secure all wiring (zip ties, tape)</li><li>Add battery voltage monitoring</li><li>Clean up wire routing</li><li>Test runtime</li></ol>`,
        checkpoints: ["Is wiring clean and secure?", "Battery monitoring added?", "Know your runtime?", "Is the robot robust?"]
      },

      {
        title: "Final Robot Build", short: "Final Build", subtitle: "Integration Testing & Obstacle Course",
        objectives: ["Final assembly and testing", "Fix remaining issues", "Run the complete robot"],
        theory: `<h4>Integration Checklist</h4>
<table><tr><th>Category</th><th>Check</th></tr>
<tr><td>Hardware</td><td>All wires secure, motors mounted, sensor forward</td></tr>
<tr><td>Power</td><td>Battery secured, capacitors installed</td></tr>
<tr><td>Software</td><td>Drives forward, detects obstacles, avoids them</td></tr>
<tr><td>Edge cases</td><td>Handles corners, doesn't get stuck</td></tr></table>`,
        practical: `<h4>Obstacle Course Challenge</h4>
<ol><li>Perform complete hardware check</li><li>Upload enhanced avoidance code</li>
<li>Create obstacle course with books/boxes</li><li>Place robot and let it run!</li>
<li>Observe and tune: adjust distances, speeds, turn durations</li><li>Document your build with photos/video!</li></ol>`,
        checkpoints: ["Is the robot fully assembled?", "Can it navigate an obstacle course?", "Have you fixed remaining issues?", "Did you document your build?"]
      },

      {
        title: "Reflection + Upgrade Path", short: "Reflection", subtitle: "What You've Achieved & What's Next",
        objectives: ["Reflect on your journey", "Identify areas for improvement", "Plan next steps", "Celebrate! 🎉"],
        theory: `<h4>Skills You Now Have</h4>
<ul><li>✅ Circuit design (Ohm's Law, power, protection)</li>
<li>✅ Component knowledge (R, C, diodes, transistors)</li>
<li>✅ Arduino programming (digital, analog, PWM)</li>
<li>✅ Sensor integration (ultrasonic, analog)</li>
<li>✅ Motor control (H-Bridge, L298N, differential drive)</li>
<li>✅ System integration (sense-think-act)</li>
<li>✅ Debugging (hardware + software)</li>
<li>✅ Autonomous behavior!</li></ul>
<div class="callout tip">💡 You built a WORKING, AUTONOMOUS robot. The same sense-think-act loop is used in industrial robots, self-driving cars, and Mars rovers.</div>`,
        practical: `<h4>Self-Assessment</h4>
<ul><li>What was the hardest part?</li><li>What concept took longest?</li><li>What failed most spectacularly?</li><li>What would you do differently?</li></ul>
<div class="callout info">💡 Every professional has burned out LEDs, fried Arduinos, and spent hours debugging one loose wire. That's not failure — that's training. Keep building. Keep learning. Welcome to robotics! 🤖</div>`,
        checkpoints: ["Did you complete all 30 days?", "Can you build circuits from scratch?", "Can you program Arduino confidently?", "Did you build a working robot? 🎉"]
      }
    ];

    const WEEKS = [
      { name: "Week 1: Electrical Foundations", color: "week1-color", emoji: "⚡", days: [1, 7] },
      { name: "Week 2: Control Components", color: "week2-color", emoji: "🎛️", days: [8, 14] },
      { name: "Week 3: Sensors & Interaction", color: "week3-color", emoji: "📡", days: [15, 21] },
      { name: "Week 4: Full Robot Build", color: "week4-color", emoji: "🤖", days: [22, 30] }
    ];

    // ========== STATE ==========
    let checks = JSON.parse(localStorage.getItem('robotics30_checks') || '{}');

    function saveChecks() { localStorage.setItem('robotics30_checks', JSON.stringify(checks)) }

    function getWeekColor(dayNum) {
      for (const w of WEEKS) if (dayNum >= w.days[0] && dayNum <= w.days[1]) return w.color;
      return 'week1-color';
    }

    // ========== RENDER SIDEBAR ==========
    function renderSidebar() {
      const sb = document.getElementById('sidebar');
      const completedDays = DAYS.filter((_, i) => {
        const dayChecks = Object.keys(checks).filter(k => k.startsWith(`d${i + 1}_`));
        return dayChecks.length > 0 && dayChecks.every(k => checks[k]);
      }).length;
      const pct = DAYS.length ? Math.round(completedDays / DAYS.length * 100) : 0;
      document.getElementById('progressPct').textContent = pct + '%';

      let html = `<div class="sidebar-header">
    <h2>🤖 30-Day Robotics</h2>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-text">${completedDays}/${DAYS.length} days completed · ${pct}%</div>
  </div>`;

      for (const w of WEEKS) {
        html += `<div class="week-group"><div class="week-label">${w.emoji} ${w.name}</div>`;
        for (let d = w.days[0]; d <= w.days[1]; d++) {
          const day = DAYS[d - 1];
          if (!day) continue;
          const dayChecks = Object.keys(checks).filter(k => k.startsWith(`d${d}_`));
          const done = dayChecks.length > 0 && dayChecks.every(k => checks[k]);
          html += `<a class="day-link ${done ? 'completed' : ''}" href="#day${d}" onclick="document.querySelector('.sidebar').classList.remove('open')">
        <span class="day-dot"></span>Day ${d}: ${day.short || day.title}
      </a>`;
        }
        html += `</div>`;
      }
      sb.innerHTML = html;
    }

    // ========== RENDER CONTENT ==========
    function renderContent() {
      const ct = document.getElementById('content');
      let html = '';
      let lastWeek = -1;

      DAYS.forEach((day, i) => {
        const dNum = i + 1;
        const weekIdx = WEEKS.findIndex(w => dNum >= w.days[0] && dNum <= w.days[1]);
        if (weekIdx !== lastWeek) {
          lastWeek = weekIdx;
          const w = WEEKS[weekIdx];
          html += `<div class="week-divider"><span>${w.emoji} ${w.name} (Days ${w.days[0]}–${w.days[1]})</span></div>`;
        }

        html += `<div class="day-card" id="day${dNum}">
      <div class="day-header">
        <div class="day-number ${getWeekColor(dNum)}">${dNum}</div>
        <div><div class="day-title">${day.title}</div>
        <div class="day-subtitle">${day.subtitle || ''}</div></div>
      </div>`;

        // Objectives
        if (day.objectives) {
          html += renderSection('🎯', 'Learning Objectives', `<ul>${day.objectives.map(o => `<li>${o}</li>`).join('')}</ul>`, true);
        }

        // Theory
        if (day.theory) {
          html += renderSection('📖', 'Theory', day.theory, true);
        }

        // Diagram
        if (day.diagram) {
          html += `<div class="circuit-diagram">${day.diagram}</div>`;
        }

        // Practical
        if (day.practical) {
          html += renderSection('🔨', 'Practical', day.practical, true);
        }

        // Troubleshooting
        if (day.troubleshooting) {
          html += renderSection('⚠️', 'Troubleshooting', `<ul>${day.troubleshooting.map(t => `<li>${t}</li>`).join('')}</ul>`, false);
        }

        // Checkpoint
        if (day.checkpoints) {
          html += `<div class="checkpoint"><h4>✅ Day ${dNum} Checkpoint</h4>`;
          day.checkpoints.forEach((c, ci) => {
            const key = `d${dNum}_${ci}`;
            const chk = checks[key] ? 'checked' : '';
            html += `<label class="check-item ${chk ? 'checked' : ''}">
          <input type="checkbox" ${chk} onchange="toggleCheck('${key}',this)"> ${c}
        </label>`;
          });
          html += `</div>`;
        }

        html += `</div>`;
      });

      // After Day 30 sections
      html += `
  <div class="week-divider"><span>🎓 What You've Achieved</span></div>
  <div class="day-card">
    <div class="section" style="border-color:rgba(16,185,129,0.3)">
      <div class="section-body open" style="display:block;padding-top:20px">
        <h4 style="color:var(--green);font-size:18px">🏆 Skills Mastered</h4>
        <ul>
          <li><strong>Circuit Design</strong> — Ohm's Law, series/parallel, power calculations</li>
          <li><strong>Components</strong> — Resistors, capacitors, diodes, transistors</li>
          <li><strong>Tools</strong> — Multimeter, breadboard, Arduino IDE</li>
          <li><strong>Programming</strong> — Arduino C/C++, digital/analog I/O, PWM</li>
          <li><strong>Sensors</strong> — Ultrasonic distance, analog reading</li>
          <li><strong>Motor Control</strong> — H-Bridge, L298N driver, differential drive</li>
          <li><strong>System Integration</strong> — Sense → Think → Act loop</li>
          <li><strong>Autonomous Behavior</strong> — Obstacle avoidance algorithm</li>
        </ul>
      </div>
    </div>
  </div>

  <div class="week-divider"><span>🔥 What's Next</span></div>
  <div class="day-card">
    <div class="section">
      <div class="section-body open" style="display:block;padding-top:20px">
        <h4>Level 2 — Intermediate</h4>
        <ul>
          <li><strong>Line-Following Robot</strong> — IR sensors + PID control</li>
          <li><strong>Remote Control</strong> — Bluetooth HC-05 + phone app</li>
          <li><strong>More Sensors</strong> — Temperature, light, IMU/accelerometer</li>
        </ul>
        <h4>Level 3 — Advanced</h4>
        <ul>
          <li><strong>Raspberry Pi</strong> — Linux, Python, camera vision</li>
          <li><strong>ROS</strong> — Robot Operating System framework</li>
          <li><strong>Computer Vision</strong> — OpenCV, object detection</li>
          <li><strong>Robotic Arms</strong> — Servos, inverse kinematics</li>
        </ul>
      </div>
    </div>
  </div>`;

      ct.innerHTML = html;
    }

    function renderSection(icon, title, body, defaultOpen) {
      return `<div class="section">
    <div class="section-header ${defaultOpen ? 'open' : ''}" onclick="this.classList.toggle('open');this.nextElementSibling.classList.toggle('open')">
      <span class="icon">${icon}</span><h3>${title}</h3><span class="chevron">▼</span>
    </div>
    <div class="section-body ${defaultOpen ? 'open' : ''}">${body}</div>
  </div>`;
    }

    function toggleCheck(key, el) {
      checks[key] = el.checked;
      saveChecks();
      el.parentElement.classList.toggle('checked', el.checked);
      renderSidebar();
    }

    // Active link on scroll
    function updateActiveLink() {
      const links = document.querySelectorAll('.day-link');
      let current = '';
      DAYS.forEach((_, i) => {
        const el = document.getElementById(`day${i + 1}`);
        if (el && el.getBoundingClientRect().top <= 150) current = `day${i + 1}`;
      });
      links.forEach(l => { l.classList.toggle('active', l.getAttribute('href') === '#' + current) });
    }
    window.addEventListener('scroll', updateActiveLink);

    // Init
    renderSidebar();
    renderContent();
  </script>
</body>

</html>
